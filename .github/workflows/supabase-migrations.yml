
name: Supabase Database Migrations

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check migration files
        run: |
          if [ ! -d supabase/migrations ]; then
            echo "Le dossier supabase/migrations est introuvable."
            exit 1
          fi

          if ! find supabase/migrations -maxdepth 1 -type f -name '*.sql' | grep -q .; then
            echo "Aucun fichier SQL de migration trouvé."
            exit 1
          fi

          echo "Les fichiers SQL de migration sont présents."
