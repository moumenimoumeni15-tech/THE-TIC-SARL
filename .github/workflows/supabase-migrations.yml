
name: Supabase Database Migrations

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify migration files
        run: |
          if ! find supabase/migrations -maxdepth 1 -type f -name '*.sql' | grep -q .; then
            echo "Aucun fichier SQL de migration trouvé."
            exit 1
          fi
          echo "Fichiers de migration détectés."

      - name: Apply database migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          supabase migration list --db-url "$SUPABASE_DB_URL"
          supabase db push --db-url "$SUPABASE_DB_URL"
